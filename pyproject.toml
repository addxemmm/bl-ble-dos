[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bl-ble-dos"
version = "0.1.0"
description = "Guided, bounded Bluetooth BR/EDR and LE availability testing with evidence bundles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "addxemmm"}]
dependencies = ["rich>=13.9,<15", "bleak==3.0.2"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/addxemmm/bl-ble-dos"
Issues = "https://github.com/addxemmm/bl-ble-dos/issues"

[project.scripts]
bt-dos = "btdos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
